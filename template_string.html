<!DOCTYPE html>

    <title>Document</title>
</head>
<body>
    <script>
        var name = "Khagesh";
        var address = "Pune";
        var phone = 96995132290;

        //normal template concatenation//
        document.write("My name is " + name + " I am form " + address + " Contact me on " + phone +  "<br>");

        //document.write(``); - backtick
        //${name} - variable interpolation
        // I am form ${address} - template literal interpolation
        //"${anme}" - string interpolation
        //Tempate string pr literal
        document.write(`My name is ${name} I am form ${address} Contact me on ${phone}`);

        //Defination
        //Template literals are string written backticks(``) that allow us to easily insert variables or expressions using ${}
    </script> 
    <script>
        var fname = "Khagesh";

        function fullname(fname, lname){
            return `${fname} ${lname}`;
        }

        let flname = `Hello $(fullName(fname, lname))`;
        document.write("<br>");
        document.write(fullname(fname,lname));
        document.write("<br>");
        document.write(flname);
        console.log(flname);
    </script>
